name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel runs superseded by a newer push to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet packages
        run: go vet ./pkg/...

      - name: Run tests
        run: go test ./pkg/...

  build:
    name: Build binary
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The test job owns setup-go's cache key, so the compiled gotk4
          # packages would never be saved. Cache them under our own key.
          cache: false

      - name: Cache Go build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-${{ runner.os }}-

      - name: Install GTK
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libgirepository1.0-dev

      - name: Build osxd
        run: make build
