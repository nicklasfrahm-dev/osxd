name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel runs superseded by a newer push to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet packages
        run: go vet ./pkg/...

      - name: Run tests
        run: go test ./pkg/...

  build:
    name: Build binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets "Verify GTK" delete a broken apt cache.
      actions: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The test job owns setup-go's cache key, so the compiled gotk4
          # packages would never be saved. Cache them under our own key.
          cache: false

      # The action keys its cache on the requested packages' versions, but not
      # their dependencies'. Add the OS release so an image upgrade never
      # restores libraries built for another Ubuntu.
      - name: Detect OS release
        id: os
        run: . /etc/os-release && echo "release=${ID}-${VERSION_ID}" >> "$GITHUB_OUTPUT"

      - name: Install GTK
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libgtk-4-dev libgirepository1.0-dev
          version: ${{ steps.os.outputs.release }}

      # The action reports success even when apt fails (for example on a stale
      # mirror), then saves the empty result under a key that never changes
      # until GTK does. Detect that, drop the bad cache so the next run starts
      # fresh, and install from apt so this run still builds.
      - name: Verify GTK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          modules="gtk4 gobject-introspection-1.0"
          pkg-config --exists $modules && exit 0
          echo "::warning::Cached GTK packages are incomplete; reinstalling from apt."
          gh cache delete "cache-apt-pkgs_${CACHE_KEY}" --ref "$GITHUB_REF" --repo "$GITHUB_REPOSITORY" ||
            echo "::warning::Could not delete cache cache-apt-pkgs_${CACHE_KEY}."
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libgirepository1.0-dev
          pkg-config --exists $modules

      # Cached cgo objects go stale when Go, the C compiler or the GTK stack
      # changes. An existing key is never re-saved, so fold those versions into
      # the key or the job would rebuild gotk4 from scratch until go.sum moved.
      - name: Fingerprint toolchain
        id: toolchain
        # Use pipefail so a missing GTK package fails here instead of hashing
        # the error output into the cache key.
        shell: bash
        run: |
          {
            go env GOVERSION
            gcc -dumpfullversion
            pkg-config --modversion gtk4 glib-2.0 gobject-2.0 gio-2.0 \
              gobject-introspection-1.0 pango cairo cairo-gobject \
              gdk-pixbuf-2.0 graphene-1.0 graphene-gobject-1.0
          } | tee /dev/stderr | sha256sum | cut -c1-16 | sed 's/^/hash=/' >> "$GITHUB_OUTPUT"

      - name: Cache Go build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ steps.toolchain.outputs.hash }}-
            go-build-${{ runner.os }}-

      - name: Build osxd
        run: make build
